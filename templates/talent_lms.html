<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TalentLMS In-Service Checker</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 760px; margin: 40px auto; padding: 0 20px; color: #222; }
        .card { border: 1px solid #ccc; border-radius: 8px; padding: 24px; margin: 20px 0; }
        .drop-box { display:block; border:2px dashed #8a8a8a; border-radius:8px; padding:42px 20px; text-align:center; cursor:pointer; background:#fafafa; }
        .drop-box.dragging { border-color:#174f79; background:#eef5fa; }
        .drop-box input { display:none; }
        .drop-title { font-size:18px; font-weight:bold; margin:0 0 8px; }
        .drop-note { color:#555; margin:0; line-height:1.5; }
        .file-list { margin-top:14px; line-height:1.7; font-weight:bold; }
        button { display:block; margin-top:24px; padding:11px 18px; font-weight:bold; cursor:pointer; }
        a { color:#174f79; }
    </style>
</head>
<body>
    <h1>TalentLMS In-Service Checker</h1>
    <p>Compare current Landmark South employees with the company-wide TalentLMS Training Matrix.</p>
    <div class="card">
        <form method="POST" enctype="multipart/form-data">
            <input type="hidden" name="action" value="upload">
            <label class="drop-box" id="drop_box" for="report_files">
                <input id="report_files" type="file" name="report_files" accept=".xlsx" multiple required>
                <p class="drop-title">Drop both Excel files here</p>
                <p class="drop-note">UKG Employee Information + TalentLMS Training Matrix<br>or click to choose both files</p>
                <div class="file-list" id="file_list"></div>
            </label>
            <button type="submit">Read Files and Choose In-Service</button>
        </form>
    </div>
    <p><a href="/">Home</a></p>
    <script>
        const dropBox = document.getElementById("drop_box");
        const fileInput = document.getElementById("report_files");
        const fileList = document.getElementById("file_list");
        function showFiles() {
            const names = Array.from(fileInput.files).map(file => file.name);
            fileList.innerHTML = names.map(name => `<div>${name}</div>`).join("");
        }
        fileInput.addEventListener("change", showFiles);
        dropBox.addEventListener("dragover", event => { event.preventDefault(); dropBox.classList.add("dragging"); });
        dropBox.addEventListener("dragleave", () => dropBox.classList.remove("dragging"));
        dropBox.addEventListener("drop", event => {
            event.preventDefault(); dropBox.classList.remove("dragging"); fileInput.files = event.dataTransfer.files; showFiles();
        });
    </script>
</body>
</html>
