<!DOCTYPE html>
<html>
<head>
    <title>TalentLMS In-Service Checker</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 760px; margin: 40px auto; padding: 0 20px; color: #222; }
        .card { border: 1px solid #ccc; border-radius: 8px; padding: 22px; margin: 20px 0; }
        label { display: block; font-weight: bold; margin-top: 16px; }
        input, select { margin-top: 6px; }
        button { padding: 10px 16px; margin: 18px 8px 0 0; cursor: pointer; }
        .note { color: #555; }
        .warning { background: #fff3cd; border: 1px solid #e2c36b; padding: 14px; border-radius: 6px; }
    </style>
</head>
<body>
    <h1>TalentLMS In-Service Checker</h1>
    <p>Compare the active UKG employee list with one month's TalentLMS in-service report.</p>

    <div class="card">
        <form method="POST" enctype="multipart/form-data">
            <label for="ukg_file">1. UKG Employee Excel Report</label>
            <input id="ukg_file" type="file" name="ukg_file" accept=".xlsx" required>

            <label for="talent_file">2. TalentLMS In-Service Report</label>
            <input id="talent_file" type="file" name="talent_file" accept=".csv" required>

            <label for="month">3. In-Service Month</label>
            <input id="month" type="month" name="month" required>

            <br>
            <button type="submit" name="action" value="check_names">Check Names First</button>
            <button type="submit" name="action" value="print_list">Create Printable List</button>
        </form>
    </div>

    <p class="note">Always use <b>Check Names First</b>. If a likely name difference is found, correct the name in TalentLMS, export the report again, and rerun the check before printing.</p>
    <p><a href="/">Home</a></p>
</body>
</html>
